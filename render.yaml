# Referencia opcional para Blueprint. La guía usa creación manual.
# Free sirve para pruebas; para operación estable elegir instancia sin suspensión.
services:
  - type: web
    name: sistema-cobro-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
